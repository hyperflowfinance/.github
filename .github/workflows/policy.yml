name: PR Policy

on:
  workflow_call:
    secrets:
      TRELLO_KEY:
        required: false
      TRELLO_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest

    steps:
      - name: Run PR policy and publish stable status
        uses: actions/github-script@v7
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.setFailed("This workflow must run on a pull_request event."); return; }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = pr.head.sha;
            const prAuthor = pr.user?.login || "";
            const isDependabotPR = prAuthor === "dependabot[bot]";
            const title = pr.title || "";
            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "").trim();
            const text = `${title}\n${body}`;
            const errors = [];
            const jiraRegex = /\b[A-Z][A-Z0-9]+-[0-9]+\b/;
            const jiraMatch = text.match(jiraRegex);
            const hasJiraTicket = Boolean(jiraMatch);
            const trelloRegex = /https?:\/\/(?:www\.)?trello\.com\/c\/([a-zA-Z0-9]+)/;
            const trelloMatch = text.match(trelloRegex);
            const trelloShortLink = trelloMatch?.[1] || null;
            const hasTrelloUrl = Boolean(trelloShortLink);
            let validTrelloCard = false;
            if (hasTrelloUrl) {
              const trelloKey = process.env.TRELLO_KEY;
              const trelloToken = process.env.TRELLO_TOKEN;
              if (!trelloKey || !trelloToken) {
                core.warning("Trello validation could not run: TRELLO_KEY and TRELLO_TOKEN secrets are required.");
              } else {
                const res = await fetch(`https://api.trello.com/1/cards/${trelloShortLink}?fields=id,closed,name,url&key=${trelloKey}&token=${trelloToken}`);
                core.info(`Trello API status: ${res.status}`);
                if (res.ok) { const card = await res.json(); validTrelloCard = card.closed === false; }
                else { errors.push(`Trello card could not be validated (API status: ${res.status}).`); }
              }
            }
            const hasValidTrelloCard = validTrelloCard;
            const isBotBypass = isDependabotPR;
            const missingTicket = !isBotBypass && !hasJiraTicket && !hasValidTrelloCard;
            if (missingTicket) {
              errors.push("PR must contain a Jira/internal ticket like HF-123 or a valid open Trello card link.");
            }
            if (!body) { errors.push("PR description cannot be empty."); }
            core.info(`PR author: ${prAuthor}`);
            core.info(`Jira ticket: ${jiraMatch?.[0] || "none"}`);
            core.info(`Trello URL found: ${hasTrelloUrl}`);
            core.info(`Trello card valid: ${hasValidTrelloCard}`);
            const passed = errors.length === 0;
            core.info(`PR policy passed: ${passed}`);
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: passed ? "success" : "failure",
              context: "hyperflow/pr-policy",
              description: passed ? "PR policy passed" : errors[0].slice(0, 140)
            });
            if (!passed) { core.setFailed(errors.join("\n")); }
